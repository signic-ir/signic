version: '3.8'

services:
  # Frontend Build Service (Node/Vite)
  frontend:
    image: node:20.14.0-alpine
    working_dir: /app
    volumes:
      - ./app:/app
    command: >
      sh -c "npm install && npm run build"
    networks:
      - signic-network
    profiles:
      - build

  # Laravel Application
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: prod
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://ain1.ir
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=signic
      - DB_USERNAME=app_user
      - DB_PASSWORD=app_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CLIENT=phpredis
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET=signic-uploads
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_PATH_STYLE=true
      - MAILPIT_HOST=mailpit
      - MAILPIT_PORT=11434
      - BROADCAST_DRIVER=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=redis
      - MAIL_MAILER=log
      - FRONTEND_URL=https://ain1.ir
      - SENTRY_DSN=
    volumes:
      - ./app:/app
      - /data/storage:/app/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - signic-network
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Queue Workers
  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://ain1.ir
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=signic
      - DB_USERNAME=app_user
      - DB_PASSWORD=app_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CLIENT=phpredis
      - QUEUE_CONNECTION=database
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - MAIL_MAILER=log
      - FRONTEND_URL=https://ain1.ir
      - SENTRY_DSN=
    command: php artisan queue:work database --tries=3 --timeout=90
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - signic-network

  # PostgreSQL Database
  db:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_DB: signic
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - ${DB_PATH:-pgdata}:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - signic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d signic"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7.2.2-alpine
    ports:
      - "6379:6379"
    networks:
      - signic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Horizon (Queue Workers) - disabled: Laravel Horizon not installed
  # horizon:
  #   build:
  #     context: ./app
  #     dockerfile: Dockerfile
  #     target: prod
  #   command: php artisan horizon
  #   environment:
  #     - APP_ENV=production
  #     - APP_DEBUG=false
  #     - APP_URL=http://localhost
  #     - DB_CONNECTION=pgsql
  #     - DB_HOST=db
  #     - DB_PORT=5432
  #     - DB_DATABASE=signic
  #     - DB_USERNAME=app_user
  #     - DB_PASSWORD=app_password
  #     - REDIS_HOST=redis
  #     - REDIS_PORT=6379
  #     - REDIS_CLIENT=phpredis
  #   ports:
  #     - "5801:5801"
  #   volumes:
  #     - horizon_data:/app/storage/app
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - signic-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "php artisan horizon:status || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:RELEASE.2024-06-14T08-03-58Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: minio
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - signic-network

  # Mailpit (Email testing)
  mailpit:
    image: axllent/mailpit:1.10.0
    ports:
      - "11434:11434"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - signic-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8025/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx (Reverse Proxy + Static Assets)
  nginx:
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./app/public:/app/public:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - signic-network

volumes:
  pgdata:
    driver: local
  minio_data:
    driver: local

networks:
  signic-network:
    driver: bridge
