version: '3.8'

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/signic
      - REDIS_URL=redis://redis:6379
      - MINIO_BUCKET=signic-uploads
      - MAILPIT_HOST=mailpit
    volumes:
      - ./app:/app
      - ./docker-compose.yml:/docker-compose.yml
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - signic-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - signic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - signic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  horizon:
    build:
      context: ./app
      dockerfile: Dockerfile
    command: php artisan horizon
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/signic
      - REDIS_URL=redis://redis:6379
    ports:
      - "5801:5801"
    volumes:
      - ./app:/app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - signic-network

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: minio
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - signic-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "11434:11434"
    environment:
      - MAILPIT_HOST=mailpit
      - MAILPIT_PORT=11434
    networks:
      - signic-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8025/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  minio-data:

networks:
  signic-network:
    driver: bridge
