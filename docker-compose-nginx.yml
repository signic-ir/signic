
networks:
  signic-network:
    driver: bridge

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/logs:/var/log/nginx
      - ./app:/app
    depends_on:
      - app
    networks:
      - signic-network

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/signic
      - REDIS_URL=redis://redis:6379
      - MINIO_BUCKET=signic-uploads
      - MAILPIT_HOST=mailpit
    volumes:
      - ./app:/app
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - signic-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - signic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - signic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "11434:11434"
    environment:
      - MAILPIT_HOST=mailpit
      - MAILPIT_PORT=11434
    networks:
      - signic-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8025/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
