server {
    listen 80;
    server_name localhost ain1.ir www.ain1.ir;
    root /app/public;
    index index.php;

    charset utf-8;

    # Static files
    location /assets/ {
        alias /app/public/assets/;
        expires 1y;
        access_log off;

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            access_log off;
            # Re-declare security headers: this block's add_header blocks
            # http-level inheritance (nginx add_header rule).
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self';" always;
        }
    }

    # API prefix routes - proxy to Laravel app
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # WebSocket/Horizon routes - disabled: Horizon service not available
    # location /horizon/ {
    #     proxy_pass http://horizon:5801/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;

    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }

    # Main SPA route - handle client-side routing (Inertia.js)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_index index.php;
        fastcgi_pass app:8000;
    }

    # Error pages
    error_page 404 /index.php;
    error_page 500 502 503 504 /index.php;

    # Health check endpoint — proxied through Laravel so it probes DB + Redis.
    location = /health {
        access_log off;
        try_files $uri /index.php?$query_string;
        # Re-declare security headers: this block's add_header blocks
        # http-level inheritance (nginx add_header rule).
        add_header Content-Type text/plain;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header ReferrerPolicy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none';" always;
    }
}
